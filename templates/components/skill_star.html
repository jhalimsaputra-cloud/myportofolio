{% with starrers=skill.starred_by.all %}
<form method="post"
      action="{% url 'main:toggle_star_skill' skill.id %}"
      class="skill-star-form">
    {% csrf_token %}

    <button type="submit"
            class="skill-star-button{% if user in starrers %} is-starred{% endif %}"
            aria-pressed="{% if user in starrers %}true{% else %}false{% endif %}"
            aria-label="Star untuk {{ skill.name }}"
            title="{% if user in starrers %}Batalkan star{% else %}Beri star{% endif %} — {{ starrers|length }} star">

        <svg class="skill-star-icon"
             viewBox="0 0 24 24"
             aria-hidden="true"
             focusable="false">
            <path d="m12 3 2.78 5.63 6.22.91-4.5 4.38
                     1.06 6.19L12 17.19l-5.56 2.92
                     1.06-6.19L3 9.54l6.22-.91L12 3Z"/>
        </svg>

        <span class="skill-star-label">
            {% if user in starrers %}Starred{% else %}Star{% endif %}
        </span>

        <span class="skill-star-total">
            {{ starrers|length }}
        </span>
    </button>
</form>
{% endwith %}
