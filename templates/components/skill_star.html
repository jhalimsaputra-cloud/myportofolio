{% with starrers=skill.starred_by.all %}
<form method="post"
      action="{% url 'main:toggle_star_skill' skill.id %}"
      class="star-form">
    {% csrf_token %}
    <button type="submit"
            class="button button-star-skill{% if user in starrers %} is-starred{% endif %}"
            aria-pressed="{% if user in starrers %}true{% else %}false{% endif %}"
            aria-label="{% if user in starrers %}Batalkan star{% else %}Beri star{% endif %} untuk {{ skill.name }}; total {{ starrers|length }} star"
            title="{% if user in starrers %}Batalkan star{% else %}Beri star{% endif %}">
        <span class="star-count-skill">{{ starrers|length }}</span>
        <span class="star-icon-skill" aria-hidden="true">★</span>
    </button>
</form>
{% endwith %}
